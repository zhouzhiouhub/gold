<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>金价查询 - Kinolin Tool</title>
    <meta name="description" content="国内金价、国际金价与品牌金饰挂牌价查询。" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/theme.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <div class="content-wrap header-inner">
          <a class="brand" href="/">
            <img class="brand-light" src="/logo/kinolin-black.svg" alt="Kinolin" />
            <img class="brand-dark" src="/logo/kinolin-white.svg" alt="Kinolin" />
          </a>
          <div class="header-end">
            <button class="refresh" id="refresh" type="button" aria-label="刷新">
              <span class="refresh-icon">↻</span>
            </button>
            <button class="icon-btn" type="button" onclick="toggleTheme()" aria-label="切换主题">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
              </svg>
            </button>
          </div>
        </div>
      </header>

      <main class="app-body">
        <div class="content-wrap">
          <h1 class="page-title">金价查询</h1>
          <p class="page-lead">切换查看国内现货、国际伦敦金与品牌金饰挂牌价。</p>

          <nav class="tabs" role="tablist">
            <button class="tab active" type="button" data-tab="domestic" role="tab">国内金价</button>
            <button class="tab" type="button" data-tab="international" role="tab">国际金价</button>
            <button class="tab" type="button" data-tab="jewelry" role="tab">国内金饰价</button>
          </nav>

          <section class="hero" id="hero">
            <div class="hero-label" id="hero-label">国内金价 (人民币/克)</div>
            <div class="hero-row">
              <div class="hero-price" id="base-price">--</div>
              <div class="hero-unit" id="hero-unit">元/克</div>
            </div>
            <div class="hero-change" id="base-change"></div>
            <div class="hero-meta" id="updated">正在获取实时行情…</div>
          </section>

          <section class="panel" id="quote-panel">
            <div class="quote-grid hidden" id="quote-grid">
              <div class="quote-cell"><span>今开</span><strong id="q-open"></strong></div>
              <div class="quote-cell"><span>最高</span><strong id="q-high"></strong></div>
              <div class="quote-cell"><span>昨收</span><strong id="q-prev"></strong></div>
              <div class="quote-cell"><span>最低</span><strong id="q-low"></strong></div>
            </div>
            <div class="related" id="related"></div>
          </section>

          <section class="panel hidden" id="jewelry-panel">
            <div class="panel-head">
              <h2>品牌金价</h2>
              <span>单位：元/克</span>
            </div>
            <div class="brand-list" id="brand-list"></div>
          </section>
        </div>
      </main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
